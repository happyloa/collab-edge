allowBuilds:
  esbuild: true
  workerd: true
overrides:
  '@esbuild-kit/esm-loader': 'npm:tsx@4.23.15'
  'fflate@>=0.7.0 <0.7.5': '0.7.5'
  'sharp@>=0.35.0 <0.35.5': '0.35.5'
  'undici@7.30.1': '7.30.2'
  'undici@8.12.3': '8.13.1'
audit:
  # No upstream release fixes this advisory yet. The version-scoped patch bounds
  # parser/walker nesting; CI checks the pinned graph and guard before the audit.
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    # picomatch has no fixed release. It is reached only through build tooling
    # with this repository's own glob patterns; CI pins the two locked versions
    # and checks that application code never imports a glob matcher.
    - GHSA-fc5q-39xc-vjpf
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

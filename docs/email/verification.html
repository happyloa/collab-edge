<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>你的 CollabEdge 登入驗證碼</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7f8fa;
      color: #1c2637;
      font-family: Arial, 'Microsoft JhengHei', sans-serif;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      完成驗證，回到你的協作空間。請勿與他人分享驗證碼。
    </div>
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f7f8fa"
    >
      <tr>
        <td align="center" style="padding: 48px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 560px"
          >
            <tr>
              <td
                style="
                  padding: 0 0 24px;
                  color: #496747;
                  font-size: 24px;
                  font-weight: bold;
                  letter-spacing: -1px;
                "
              >
                CollabEdge<span
                  style="
                    font-size: 12px;
                    font-weight: normal;
                    letter-spacing: 2px;
                    color: #647085;
                  "
                >
                  &nbsp; WORK TOGETHER</span
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #ffffff;
                  border: 1px solid #e3e7ed;
                  border-top: 4px solid #496747;
                  border-radius: 12px;
                  padding: 36px 24px;
                "
              >
                <p
                  style="
                    margin: 0 0 16px;
                    color: #496747;
                    font-size: 12px;
                    font-weight: bold;
                    letter-spacing: 3px;
                  "
                >
                  確認是你，安心協作
                </p>
                <h1
                  style="
                    margin: 0 0 16px;
                    font-size: 28px;
                    line-height: 1.4;
                    letter-spacing: -1px;
                  "
                >
                  你的工作空間，<br />準備好了。
                </h1>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 15px;
                    line-height: 1.9;
                    color: #647085;
                  "
                >
                  請回到剛才的登入頁面，輸入下方驗證碼，<br />繼續與團隊一起完成下一件好事。
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        padding: 24px 8px;
                        background: #f0f4ee;
                        border: 1px solid #dce5d8;
                        border-radius: 8px;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 12px;
                          font-size: 12px;
                          color: #496747;
                        "
                      >
                        一次性登入驗證碼
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-family: 'Courier New', monospace;
                          font-size: 36px;
                          font-weight: bold;
                          letter-spacing: 6px;
                          color: #29452e;
                        "
                      >
                        {{code}}
                      </p>
                      <p
                        style="
                          margin: 14px 0 0;
                          font-size: 12px;
                          color: #647085;
                        "
                      >
                        有效時間以登入頁面提示為準
                      </p>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 14px;
                    line-height: 1.8;
                    color: #647085;
                  "
                >
                  請勿將驗證碼分享給任何人。若你沒有提出登入要求，請忽略這封郵件。
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 8px;
                  font-size: 12px;
                  line-height: 1.9;
                  color: #647085;
                "
              >
                小小一步，讓好點子安全前進。<br /><strong style="color: #496747"
                  >CollabEdge</strong
                >
                · 讓協作更靠近。<br />這是一封系統通知，請勿直接回覆。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

name: Public demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showcase.yml'
      - '.pnpmfile.cjs'
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'public/**'
      - 'showcase/**'
      - 'src/**'
      - 'tsconfig.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:showcase
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:showcase
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

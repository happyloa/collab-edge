name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: node scripts/setup-local.mjs
      - run: pnpm cf:typegen
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
